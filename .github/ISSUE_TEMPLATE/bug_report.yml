name: 🐛 Bug Report
description: File a report to help us reproduce and fix an issue
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please fill out this form with as much detail as possible to help us diagnose and fix the issue quickly.

  - type: textarea
    id: bug-description
    attributes:
      label: 📝 Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "Example: The application crashes immediately when clicking the export button."
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: 🔁 Steps to Reproduce
      description: Tell us how to reproduce the behavior. Be as specific as possible.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: 🤔 Expected Behavior
      description: A clear and concise description of what you expected to happen.
      placeholder: "Example: The file should download successfully in CSV format."
    validations:
      required: true

  - type: textarea
    id: screenshots-logs
    attributes:
      label: 📸 Screenshots or Logs
      description: Add any relevant screenshots, animated GIFs, or console/error logs here.
      placeholder: "Drag and drop images or paste text/logs here..."
    validations:
      required: false

  - type: dropdown
    id: environment
    attributes:
      label: 💻 Operating System / OS Version
      description: Select the operating system where the bug occurs.
      options:
        - Windows
        - macOS
        - Linux
        - iOS
        - Android
        - Multiple / All
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 📦 Project Version
      description: What version of the application/project are you running?
      placeholder: "e.g., v1.4.2, main branch, etc."
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: 📌 Final Checklist
      options:
        - label: I have searched existing issues to ensure this bug has not been reported yet.
          required: true
        - label: I am using the latest available version of the project.
          required: true
